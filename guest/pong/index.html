<!doctype html>
<html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Pong</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#111315;color:#eee;font:15px system-ui,sans-serif;min-height:100svh;display:grid;place-items:center;padding:22px}
main{width:min(100%,800px)}header{display:flex;align-items:baseline;justify-content:space-between;margin-bottom:14px}h1{font:500 22px ui-monospace,monospace;margin:0}#status{color:#b8bdc1;font-size:13px}
canvas{display:block;width:100%;aspect-ratio:12/7;background:#171b1e;border:1px solid #363d42;outline:none;touch-action:none}canvas:focus-visible{outline:2px solid #a9cee6;outline-offset:3px}
footer{display:flex;justify-content:space-between;gap:14px;align-items:center;flex-wrap:wrap;margin-top:15px}p{font-size:13px;color:#aeb5ba;margin:0;line-height:1.65}button{font:inherit;color:#eee;background:#252c31;border:1px solid #49545c;border-radius:4px;padding:8px 15px;cursor:pointer}button:hover{background:#354048}button:focus-visible{outline:2px solid #a9cee6;outline-offset:3px}.buttons{display:flex;gap:8px}.note{margin-top:13px;font-size:12px;color:#858f97}
@media(max-width:500px){body{padding:14px}h1{font-size:20px}#status{font-size:12px}footer{align-items:flex-start}button{padding:8px 12px}}
</style>
<main><header><h1>Pong</h1><span id="status" role="status" aria-live="polite">First to 5</span></header>
<canvas id="court" width="720" height="420" tabindex="0" aria-label="Pong court. Move the left paddle with W and S, arrow keys, mouse, or touch."></canvas>
<footer><p>W / S or ↑ / ↓ to move · Mouse & touch work too<br>Space to pause · R to restart · You play on the left</p><div class="buttons"><button id="play">Start</button><button id="restart">Restart</button></div></footer>
<p class="note">Made by the orchestrator and worker VMs with a supplied canvas scaffold.</p></main>
<script src="config.js"></script><script src="logic.js"></script><script src="engine.js"></script><script src="view.js"></script>
</html>
